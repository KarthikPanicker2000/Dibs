<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dibs · my agent</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --line: #2a3342; --text: #e6edf3; --muted: #8b98a9; --accent: #7c9cff; --gold: #f2c14e; --green: #3fb950; --red: #f85149; --amber: #d29922; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 14px 16px 90px; max-width: 640px; }
  h1 { font-size: 22px; margin: 2px 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .card.live { border-color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #263041; color: var(--muted); }
  .chip.on { background: var(--accent); color: #0b1020; }
  .item { border-top: 1px solid var(--line); padding: 10px 0; }
  .item:first-child { border-top: none; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 700; }
  .val { font-size: 24px; font-weight: 800; min-width: 2ch; text-align: right; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  details summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  input[type=number], textarea { width: 100%; background: #0b0f15; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px; font-size: 16px; margin-top: 6px; }
  button { padding: 13px; border-radius: 10px; border: 1px solid var(--line); background: #1c2330; color: var(--text); font-size: 16px; font-weight: 700; width: 100%; }
  button.primary { background: var(--accent); color: #0b1020; border: none; }
  button.danger { background: #3a1416; color: #ffb4ae; border-color: var(--red); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .price { font-size: 44px; font-weight: 800; color: var(--gold); text-align: center; font-variant-numeric: tabular-nums; }
  .center { text-align: center; }
  .bar { height: 10px; border-radius: 6px; background: #0b0f15; overflow: hidden; margin: 6px 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 2px; border-top: 1px solid var(--line); vertical-align: top; }
  td:last-child { text-align: right; }
  #msg { min-height: 22px; font-weight: 600; margin-top: 8px; }
  .locked { opacity: .55; }
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 10px 16px; border-top: 1px solid var(--line); }
  .sticky .row { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div class="meta" id="room">Dibs · your private agent</div>
<h1 id="hello">Loading…</h1>
<div><span class="chip" id="phase">…</span> <span class="meta" id="seat"></span></div>

<div class="card" id="instr" hidden><h2>Instructions</h2><div id="instrText"></div></div>
<div class="card live" id="live" hidden></div>
<div class="card" id="results" hidden></div>

<div class="card" id="prefsCard">
  <h2>My preferences</h2>
  <div class="meta">🔒 Only your agent sees these. Others see just NONE / WANT / STRONG until the verdict.<br>
    0 = won't take it · 1–4 = meh · 5–6 = want · 7–10 = really want · at most <b id="maxtop">3</b> items rated 9–10.</div>
  <div id="items"></div>
  <div id="msg"></div>
</div>
<div class="card" id="feedCard" hidden><h2>Room feed</h2><div id="feed" class="meta"></div></div>

<div class="sticky" id="bar"><div class="row">
  <button id="demo">Auto-fill demo</button>
  <button id="save" class="primary">Save privately</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const money = x => x == null ? "not appraised yet" : "$" + Number(x).toLocaleString("en-US", {maximumFractionDigits: 2});
const label = r => r == 0 ? "won't take" : r <= 4 ? "meh" : r <= 6 ? "want" : "really want";
const PH = {SETUP: "Setting up", APPRAISE: "Appraising", INTAKE: "Rate the items", EASY_ALLOC: "Easy items", NEGOTIATE: "Agents negotiating",
            AUCTION: "Bidding war", JUDGE: "Verdict", REVEAL: "Reveal"};
let TOKEN = null; try { TOKEN = localStorage.getItem("token"); } catch {}
let cat = null, me = null, st = null, formBuilt = false, dirty = false, bidMsg = "";

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Owner-Token": TOKEN || "", ...(opts.headers || {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function claim() {
  try {
    const c = await api("claim", {method: "POST", body: JSON.stringify({token: TOKEN})});
    TOKEN = c.token; try { localStorage.setItem("token", TOKEN); } catch {}
    $("seat").textContent = "· this phone holds your seat";
    return true;
  } catch (e) {
    $("hello").textContent = "Seat taken";
    $("prefsCard").innerHTML = `<div class="bad">${esc(e.message)}</div>`; $("bar").hidden = true;
    return false;
  }
}

async function loadCatalog() {
  try { cat = await api("catalog"); } catch { $("hello").textContent = "Waiting for the organizer to open the room…"; setTimeout(loadCatalog, 2000); return; }
  $("hello").textContent = `Hi ${cat.name}`;
  $("room").textContent = cat.title;
  $("maxtop").textContent = cat.max_top_ratings;
  $("demo").hidden = !cat.has_demo;   // rooms without demo ratings: only Save
  if (await claim()) { buildForm(); tick(); }
}

function buildForm() {
  $("items").innerHTML = cat.items.map(it => {
    const lockedOther = it.locked_to && it.locked_to !== cat.you;
    return `<div class="item ${lockedOther ? "locked" : ""}">
      ${it.image ? `<img src="${esc(it.image)}" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:6px">` : ""}
      <div class="top"><div><div class="name">${it.image ? "" : it.emoji || "📦"} ${esc(it.name)}</div>
        <div class="meta">${money(it.market_value)}${it.locked_to ? " · 🔒 the will gives this to " + esc(it.locked_to === cat.you ? "you" : it.locked_to) : ""}</div></div>
        <div><div class="val" id="v-${it.id}">0</div><div class="lbl" id="l-${it.id}">won't take</div></div></div>
      <input type="range" min="0" max="10" step="1" value="0" id="r-${it.id}">
      <details><summary>Private max price & reason (optional)</summary>
        <input type="number" min="0" step="50" placeholder="Most you'd pay (private)" id="m-${it.id}">
        <textarea rows="2" placeholder="Why it matters to you (your agent may share the feeling, never numbers)" id="w-${it.id}"></textarea>
      </details></div>`;
  }).join("");
  cat.items.forEach(it => {
    $("r-" + it.id).oninput = () => { dirty = true; update(it.id); };
    $("m-" + it.id).oninput = $("w-" + it.id).oninput = () => { dirty = true; };
  });
  formBuilt = true;
}

function fill(p) {
  cat.items.forEach(it => {
    $("r-" + it.id).value = p.ratings[it.id] ?? 0;
    $("m-" + it.id).value = p.max_prices[it.id] ?? "";
    $("w-" + it.id).value = p.reasons[it.id] ?? "";
    update(it.id);
  });
}

function update(id) {
  const r = +$("r-" + id).value;
  $("v-" + id).textContent = r; $("l-" + id).textContent = label(r);
  const top = cat.items.filter(it => +$("r-" + it.id).value >= 9).length;
  $("msg").innerHTML = top > cat.max_top_ratings ? `<span class="bad">Too many 9–10 ratings (${top}/${cat.max_top_ratings}).</span>` : "";
}

$("demo").onclick = async () => {
  try { fill(await api("demo_prefs")); dirty = true; $("msg").innerHTML = `<span class="ok">Demo ratings filled in. Tap Save.</span>`; }
  catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};
$("save").onclick = async () => {
  const body = {ratings: {}, max_prices: {}, reasons: {}};
  cat.items.forEach(it => {
    body.ratings[it.id] = +$("r-" + it.id).value;
    const m = $("m-" + it.id).value; if (m) body.max_prices[it.id] = +m;
    const w = $("w-" + it.id).value.trim(); if (w) body.reasons[it.id] = w;
  });
  try { await api("prefs", {method: "POST", body: JSON.stringify(body)}); dirty = false;
        $("msg").innerHTML = `<span class="ok">✔ Saved inside your agent. Only NONE / WANT / STRONG will be shared.</span>`; }
  catch (e) { $("msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
};

async function override(item, action) {
  const amount = action === "stay" ? +$("upto").value : null;
  try { const r = await api("auction/override", {method: "POST", body: JSON.stringify({item_id: item, action, amount})});
        bidMsg = `<span class="ok">${action === "drop" ? "You're out of this one." : "Your agent now stays in up to " + money(r.drop) + "."}</span>`; }
  catch (e) { bidMsg = `<span class="bad">${esc(e.message)}</span>`; }
  $("bidmsg").innerHTML = bidMsg;
}

function nameOf(pid) { return (st?.scenario?.participants.find(p => p.id === pid) || {name: pid}).name; }

function renderLive() {
  const a = st && st.auction, el = $("live");
  if (!st || !["NEGOTIATE", "AUCTION"].includes(st.phase) || (st.phase === "AUCTION" && !a)) {
    el.hidden = !(st && st.phase === "NEGOTIATE");
    if (!el.hidden && !$("liveInfo")) el.innerHTML = "";
    if (!el.hidden) el.innerHTML = `<h2>Negotiation</h2><div>Your agent is negotiating the contested items for you. Messages stay sealed until the reveal.</div>`;
    return;
  }
  if (st.phase !== "AUCTION") return;
  el.hidden = false;
  const it = cat.items.find(i => i.id === a.item_id) || {name: a.item_id};
  const mine = a.contestants.includes(cat.you);
  const out = a.dropped[cat.you] != null, won = a.winner === cat.you;
  const drop = me && me.drops[a.item_id], cap = st.remaining[cat.you], cap0 = st.caps[cat.you];
  const manual = !!st.human_bidding;
  let status = "", controls = "";
  if (mine) {
    status = won ? `<div class="ok center"><b>🏆 You won it at ${money(a.price)}</b></div>`
      : a.winner ? `<div class="center meta">${esc(nameOf(a.winner))} won it at ${money(a.price)}</div>`
      : out ? `<div class="bad center"><b>You're out</b> (dropped at ${money(a.dropped[cat.you])})</div>`
      : manual ? `<div class="center">You're <b class="ok">IN</b> at ${money(a.price)}. Press <b>Drop out</b> when it's too much for you.</div>`
      : `<div class="center">You're <b class="ok">still in</b>${drop != null ? ` · your agent stays in up to <b>${drop < 0 ? "—" : money(drop)}</b>` : ""}</div>`;
    controls = !a.winner && !out && drop != null ? (manual ? `
      <div class="row"><button class="danger" style="font-size:22px;padding:20px" onclick="override('${a.item_id}','drop')">✋ Drop out</button></div>
      <details style="margin-top:8px"><summary>Auto-drop at a price (optional)</summary>
        <div class="row"><input type="number" id="upto" placeholder="Drop me automatically above $" step="50" min="0" value="${drop > 0 && drop < me.caps[a.item_id] ? Math.round(drop) : ""}"></div>
        <div class="row"><button class="primary" onclick="override('${a.item_id}','stay')">Set auto-drop</button></div></details>
      <div class="meta">You'll be dropped automatically at your spend cap of ${money(me.caps[a.item_id])}.</div>` : `
      <div class="row"><input type="number" id="upto" placeholder="Stay in up to $" step="50" min="0" value="${drop > 0 ? Math.round(drop) : ""}"></div>
      <div class="row"><button class="primary" onclick="override('${a.item_id}','stay')">Set my limit</button>
        <button class="danger" onclick="override('${a.item_id}','drop')">Drop out now</button></div>
      <div class="meta">Your limit can't go above your spend cap of ${money(me.caps[a.item_id])}.</div>`) : "";
  } else {
    status = `<div class="center meta">You're watching: ${a.contestants.map(nameOf).map(esc).join(" vs ")}</div>`;
  }
  const head = a.status === "countdown" ? `<div class="center warn"><b>Bidding opens in ${a.countdown}s</b>. ${manual ? "Get ready." : "Set your limit now."}</div>`
             : `<div class="center meta">${a.status === "done" ? "SOLD" : "Clock rising"}</div>`;
  if (el.dataset.item !== a.item_id) { el.dataset.item = a.item_id; bidMsg = ""; }
  if (!$("liveInfo")) el.innerHTML = `<h2>Bidding war</h2><div id="liveInfo"></div><div id="liveCtl"></div><div id="bidmsg" class="center"></div><div id="liveCap"></div>`;
  $("liveInfo").innerHTML = `${head}${it.image ? `<img src="${esc(it.image)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:6px 0">` : ""}
    <div class="center name">${it.image ? "" : it.emoji || ""} ${esc(it.name)} · market ${money(a.market)}</div>
    <div class="price">${money(a.price)}</div>${status}`;
  // buttons are only rebuilt when they change, so a tap never lands on a button being replaced
  if ($("liveCtl").dataset.html !== controls) { $("liveCtl").dataset.html = controls; $("liveCtl").innerHTML = controls; }
  $("bidmsg").innerHTML = bidMsg;
  $("liveCap").innerHTML = cap0 != null ? `<div class="meta">Your spend cap: ${money(Math.max(0, cap))} left of ${money(cap0)}</div><div class="bar"><i style="width:${Math.max(0, 100 * cap / cap0)}%"></i></div>` : "";
}

function renderResults() {
  const v = st && st.verdict, el = $("results");
  if (!v) { el.hidden = true; return; }
  el.hidden = false;
  const items = Object.fromEntries(cat.items.map(i => [i.id, i]));
  const got = v.outcomes.filter(o => o.winner === cat.you);
  const net = v.transfers.reduce((t, x) => t + (x.payee === cat.you ? x.amount : x.payer === cat.you ? -x.amount : 0), 0);
  const ok = v.attestations[cat.you];
  const f = me && me.fairness;
  const p = me && me.prefs;
  const rows = p ? v.outcomes.filter(o => (p.ratings[o.item_id] || 0) >= 5 || o.winner === cat.you).map(o => {
    const r = p.ratings[o.item_id] || 0, mineWon = o.winner === cat.you, val = me.values[o.item_id];
    const res = mineWon ? `<span class="ok">✓ yours${o.method !== "locked" ? " at " + money(o.price) : ""}</span>`
      : o.winner ? `<span class="warn">✗ ${esc(nameOf(o.winner))} at ${money(o.price)}</span><div class="meta">${o.price <= val ? "under" : "over"} your value ${money(val)}; you're paid your share</div>`
      : `<span class="meta">unwanted pile</span>`;
    return `<tr><td>${items[o.item_id].emoji} ${esc(items[o.item_id].name)}<div class="meta">you rated it ${r}</div></td><td>${res}</td></tr>`;
  }).join("") : "";
  el.innerHTML = `<h2>Your result</h2>
    <div style="font-size:20px"><b class="${ok ? "ok" : "warn"}">${ok ? "✅ Fair share" : "⚠️ Below your fair share"}</b></div>
    ${f && f.got != null ? `<div class="meta">By your own values you end up with ${money(f.got)}; your fair share is ${money(f.proportional_share)}.</div>` : ""}
    <p><b>You get:</b> ${got.length ? got.map(o => items[o.item_id].emoji + " " + esc(items[o.item_id].name)).join(", ") : "no items"}<br>
       <b>${net < 0 ? "You pay" : "You receive"}:</b> ${money(Math.abs(net))}</p>
    ${v.transfers.filter(t => t.payer === cat.you || t.payee === cat.you).map(t => `<div>💸 ${esc(t.text)}</div>`).join("")}
    <p class="meta">${esc(v.explanations[cat.you] || "")}</p>
    ${rows ? `<h2 style="margin-top:12px">What you wanted vs what happened</h2><table>${rows}</table>` : ""}`;
}

function render() {
  if (!st || !st.scenario) return;
  $("phase").textContent = PH[st.phase] || st.phase;
  $("phase").className = "chip" + (st.phase === "INTAKE" || st.phase === "AUCTION" ? " on" : "");
  const instr = [st.scenario.will, ...(st.scenario.notes || [])].filter(Boolean);
  $("instr").hidden = !instr.length;
  $("instrText").innerHTML = instr.map(x => `<div style="margin-bottom:6px">${esc(x)}</div>`).join("");
  const locked = me && me.locked;
  $("bar").hidden = locked;
  document.querySelectorAll("#items input, #items textarea").forEach(x => x.disabled = !!locked);
  if (locked) $("msg").innerHTML = `<span class="meta">🔒 Ratings are locked now that the room is dividing items.</span>`;
  renderLive(); renderResults();
  const evs = st.events.slice(-6).reverse();
  $("feedCard").hidden = !evs.length;
  $("feed").innerHTML = evs.map(e => `<div style="margin-bottom:4px">${esc(e.text)}</div>`).join("");
}

async function tick() {
  try {
    me = await api("me");
    if (formBuilt && !dirty && me.prefs) fill(me.prefs);
    st = await api("room_state");
    render();
  } catch (e) { /* keep polling */ }
  setTimeout(tick, 1000);
}
loadCatalog();
</script>
</body>
</html>
