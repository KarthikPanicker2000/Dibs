<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Dibs</title>
<style>
  body { margin: 0 auto; max-width: 520px; padding: 20px 16px; background: #0d1117; color: #e6edf3; font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 24px; margin: 4px 0 6px; } .meta { color: #8b98a9; font-size: 14px; }
  a.seat { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 16px; border-radius: 12px; background: #161b22; border: 1px solid #2a3342; color: #e6edf3; text-decoration: none; font-size: 20px; font-weight: 700; }
  a.seat span { font-size: 13px; font-weight: 600; color: #8b98a9; }
  .will { background: #1f2a3d; border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-size: 15px; }
</style>
</head>
<body>
<div class="meta">Dibs · join the room</div>
<h1 id="title">Loading…</h1>
<div id="will"></div>
<div id="openBox" hidden>
  <p class="meta">Type your name to take a seat. Your phone then talks only to your own private agent.</p>
  <form id="joinForm" style="display:flex;gap:8px">
    <input id="myname" maxlength="30" placeholder="Your name" autocomplete="given-name" required
      style="flex:1;min-width:0;box-sizing:border-box;padding:14px;font-size:18px;border-radius:12px;border:1px solid #2a3342;background:#0b0f15;color:#e6edf3">
    <button style="padding:14px 20px;font-size:18px;font-weight:700;border-radius:12px;border:none;background:#7c9cff;color:#0b1020">Join</button>
  </form>
  <div id="joinErr" style="color:#f85149;min-height:22px;margin-top:6px"></div>
</div>
<p class="meta" id="how">Who are you? Tap your name. Your phone then talks only to your own private agent.</p>
<div id="seats"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function load() {
  const s = await (await fetch("/state")).json();
  if (!s.scenario) { setTimeout(load, 2000); return; }
  document.getElementById("title").textContent = s.scenario.title;
  document.getElementById("will").innerHTML = s.scenario.will ? `<div class="will">${esc(s.scenario.will)}</div>` : "";
  const open = s.scenario.open_seats;
  document.getElementById("openBox").hidden = !open;
  document.getElementById("how").textContent = open
    ? (s.scenario.participants.length ? "Already joined? Type the same name, or tap it:" : "")
    : "Who are you? Tap your name. Your phone then talks only to your own private agent.";
  document.getElementById("seats").innerHTML = s.scenario.participants.map(p =>
    `<a class="seat" href="/join/${encodeURIComponent(p.id)}">${esc(p.name)}<span>${p.agent_url ? (s.joined[p.id] ? "joined · tap to rejoin" : "open seat") : "no phone agent"}</span></a>`).join("");
}
document.getElementById("joinForm").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/join", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({name: document.getElementById("myname").value})});
  const j = await r.json().catch(() => ({}));
  if (r.ok) location.href = j.url; else document.getElementById("joinErr").textContent = j.detail || "Couldn't join.";
};
load();
setInterval(load, 3000);   // new seats show up as people join
</script>
</body>
</html>
